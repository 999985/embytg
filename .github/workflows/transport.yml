name: transport

# GitHub Actions 辅助搬运（2026-11-21）
#
# 设计原则：**GHA 只搬字节，不碰控制面。**
#   ① 不用 SSH 回连 Oracle（公开仓库里放能登 root 的私钥 = 把服务器交出去）
#   ② 不用生产 session（1-4 号在主控机上跑，同号双 IP = AuthKeyDuplicated = 废号）
#   ③ 只认 GH_SESSION_STRING（消耗号，丢了不心疼）
#
# 工作流：读 queue/assign.json → 下 1 个文件 → 传 TG 存储频道 → 提交结果到 queue/
#         控制面轮询结果并做 teldrive/Emby 登记（登记只能在 Oracle，因为 teldrive 只听 127.0.0.1）
#
# 触发：手动（默认）或定时。定时前请先确认消耗号可用、且 Oracle 侧队列在发活。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "本轮最多搬几个（建议 1）"
        default: "1"
        required: true
      dry_run:
        description: "演练：只下载、不上传（不需要 GH_SESSION_STRING）"
        default: "true"
        required: true
  # 过渡期：偶尔跑一次（每 6 小时，每次 1 个），不追求产能，只求验证稳定性。
  # 队列为空时脚本会直接退出，不会空烧额度。
  # schedule:   # GHA 已停用（用户决定）
  #   - cron: "0 */6 * * *"

# 同一时刻只允许一个 run，避免并发被判定为滥用
concurrency:
  group: gha-transport
  cancel-in-progress: false

permissions:
  contents: write      # 只用于把结果 JSON 提交回仓库

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # 方案 C 不限体积，窗口放宽到 90 分钟
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 熔断开关
        run: |
          if [ -f pipeline/queue/PAUSED ]; then
            echo "检测到 queue/PAUSED，直接退出"; exit 0
          fi

      - name: 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依赖
        run: pip install --quiet telethon

      - name: 搬运
        env:
          # 只用消耗号；生产 1-4 号永远不进 GitHub
          GH_SESSION_STRING: ${{ secrets.GH_SESSION_STRING }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STORE_CH: ${{ secrets.TG_STORE_CH }}
          # schedule 触发时 inputs 为空，必须给默认值
          LIMIT: ${{ github.event.inputs.limit || '1' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/gha_transport_run.py

      - name: 失败留痕
        if: failure()
        run: echo "失败请把本 run 的日志尾部贴给控制面排查"
